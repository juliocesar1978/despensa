version: "3.8"

services:
  despensa-api:
    build: ./api
    container_name: despensa-api
    restart: unless-stopped
    environment:
      DEPLOY_EDITION: ${DEPLOY_EDITION:-lite}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET nas variaveis do stack}
      NODE_ENV: production
      PORT: 3000
    volumes:
      - despensa-data:/app/data
      - despensa-uploads:/app/uploads
    networks:
      - public-net

  despensa-app:
    build: ./app
    container_name: despensa-app
    restart: unless-stopped
    depends_on:
      - despensa-api
    networks:
      - public-net

networks:
  public-net:
    external: true
    name: ${rede:-web_network}

volumes:
  despensa-data:
  despensa-uploads:
